    observacaoLiteral: |-
      ▪ O resultado permanece positivo, demonstrando a evolução de ações no que se referem a qualificação da base de clientes.

      ▪ Ao longo do trimestre, foram realizadas novas campanhas via push, com divulgação dos produtos de loterias, promoção de jogo responsável e com foco em concurso especiais, como Mega 30 anos, Quina de São João e Loteca Especial.

      ▪ Ao final do período do 2TRI/2026, a meta a ser alcançada de 10% da base, atingiu 78,58% (2.371.981 pessoas), representando 785,75% de alcance da meta. Contribuíram para o resultado de 78,58%, além do cronograma habitual de campanhas gerais, o aumento no volume de feriados locais (motivador de oferta personalizada aos clientes) com destaque para o Corpus Christi (não é feriado nacional) e os dias 13/06, 24/06 e 29/06 cujo alcance foi de cerca de 1,3 mil municípios. Esse contexto ampliou a sobreposição na base, fazendo com que uma parcela maior de clientes recebesse 2 ou mais notificações, conforme a regra do indicador.

