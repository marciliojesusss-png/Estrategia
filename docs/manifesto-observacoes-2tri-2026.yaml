    tamanhoCaracteres: 3378
    tamanhoUtf8Bytes: 3513
    sha256: "31068469d07177643c26d8e974ffdfd63819a4e5d92f08455873f0fb1235a031"
    observacaoLiteral: |-
      A seguinte curva de meta foi definida para 2026 com relação ao presente indicador:
      ▪ 1TRI26: 35% - Realização de Consulta Pública de Informações – RFI (Request for Information);
      ▪ 2TRI26: 70% - Realização de Consulta Pública de Propostas – RFP (Request for Proposal);
      ▪ 3TRI26: 85% - Iniciação da Fase Seleção;
      ▪ 4TRI26: 100% - Contrato assinado com fornecedor.

      ▪ A curva de meta previa a realização de RFP, que não ocorreu visto que em MAI/2026 a CAIXA Loterias realizou a contratação do GARTNER, e iniciou o alinhamento de forma a aprofundar a estratégia de Tecnologia e ratificar os caminhos de contratação a serem adotados para ampliação da capacidade de entrega de soluções para a CAIXA Loterias, considerando os subsídios recebidos em RFI (request for information).

      ▪ Dessa forma, no que se refere à proposta do indicador, foi realizada a compilação dos insumos do RFI, bem como rodadas de reuniões com fornecedores, e estão sendo realizados os estudos dos modelos de contratação adequados, que consubstanciarão as propostas de contratação com prosseguimento no 3º trimestre, no qual devem ser realizados RFP (request for proposal), conforme o caso.

      ▪ A coleta dos insumos de mercado, e a revisão dos modelos a serem adotados é fundamental para permitir a continuidade das iniciativas de forma coordenada na companhia, otimizando esforços e frentes de atuação. Em JUL/2026 está prevista a realização de workshop presencial junto a Gartner e CAIXA Loterias, a partir do qual haverá o aprofundamento e consolidação das informações, bem a configuração do desenho a ser seguido em relação às contratações.

      ▪ No projeto de desenvolvimento da Nova Plataforma de Loterias, em JUN/2026 foi realizada a demanda de contratação de 23 profissionais da fábrica de software fornecedor Spassu, com o objetivo de ampliação da capacidade de desenvolvimento da equipe atual permitindo criar paralelismo das SQUAD e acelerar as entregas do projeto, cujas contratações efetivas devem ocorrer ao longo do 3º tri.

      ▪ Com essas contratações e aporte dos profissionais, haverá o atingimento do indicador, em que pese seu status atual de aquém do esperado no 2TRI/2026.

      ▪ Cabe mencionar ainda sobre a consultoria de tecnologia, definida na Estratégia de Tecnologia da empresa, que auxiliará no aprofundamento das discussões em relação as ações de longo prazo da companhia, após a consolidação das contribuições do RFI, foi formatado TR para solicitação de propostas. Este TR foi submetido a revisão inicial do Gartner, cujas contribuições estão em andamento, para prosseguimento junto ao mercado no 3º trimestre.

      ▪ Ainda, na frente de CRM (Customer Relationship Manegement)6, ao longo do período foram realizadas etapas do processo de pesquisa de mercado para contratação de uma plataforma de CRM.

      ▪ Em paralelo, a Controladora CAIXA aprovou em rito de governança próprio a contratação da empresa Salesforce, contemplado em seu objeto plataforma de CRM para a CAIXA. Nesse sentido, foram iniciados alinhamentos para uso pela CAIXA Loterias, via Termo Ajuste Operacional (TAO).

      6 CRM significa Customer Relationship Management, em português Gestão de Relacionamento com o Cliente. Refere-se a uma plataforma de gestão do relacionamento com clientes, voltada à integração de dados, personalização de interações, apoio a campanhas e melhoria da experiência do cliente ao longo de sua jornada.

