    tamanhoUtf8Bytes: 2680
    sha256: "b51e805e2ed415180ebc41d426b7cdf6bde26dfe69b0fc79823581aee8f4479e"
    observacaoLiteral: |-
      ▪ A partir da realização da pesquisa NPS de baseline de 2025, foram definidas 22 melhorias como plano de trabalho ao longo do ano de 2026, em que para atingimento da meta anual do indicador para o ano é necessária a entrega de ao menos 06 melhorias, representando assim a meta de 25% das ocorrências apontadas.

      ▪ As melhorias mapeadas demandam implantação junto à área de TI da CAIXA.

      ▪ Nesse sentido, convém relembrar que a curva definida para o ano foi estruturada trimestralmente da seguinte forma:

      ▪ 1TRI26: 4,54% - entrega de 01 melhoria do plano de trabalho de 2026;
      ▪ 2TRI26: 13,64% - entrega de 03 melhorias (acumuladas) do plano de trabalho de 2026;
      ▪ 3TRI26: 18,18% - entrega de 04 melhorias (acumuladas) do plano de trabalho de 2026;
      ▪ 4TRI26: 251% - entrega de 06 melhorias (acumuladas) do plano de trabalho de 2026.

      ▪ No 2º trimestre foram implementadas 03 (três) melhorias2, as quais detalhamos abaixo:

      i) Conferência automática completa: Foi disponibilizada a conferência automática das apostas Teimosinhas3, permitindo ao cliente visualizar de forma simples o resultado de cada concurso, com indicação clara das situações “Premiada”, “Não premiada” e “Em apuração”. A melhoria trouxe mais transparência e reduziu o esforço necessário para acompanhar os resultados.

      ii) Tela específica para Teimosinhas: Foi criada uma tela dedicada para acompanhamento das Teimosinhas, reunindo em um único local a linha do tempo dos concursos, a informação de encerramento da aposta e um resumo consolidado dos resultados. A iniciativa simplificou a navegação e facilitou o acompanhamento da aposta pelo cliente.

      iii) Conferência automática de Teimosinhas - "Conferir Tudo": Foi implementada solução de conferência automática para apostas tipo Teimosinhas, passando a apresentar em uma única consulta o resultado de todos os concursos vinculados à aposta. Antes, os clientes visualizavam apenas o primeiro concurso, o que exigia consultas e conferências manuais e gerava dúvidas sobre a situação das apostas. A melhoria simplificou o acompanhamento dos resultados, reduziu etapas no processo de conferência e proporcionou uma experiência mais ágil e transparente para o apostador.

      1 O plano de trabalho previsto para atendimento desse indicador considera o escopo de 22 melhorias mapeadas posteriormente à definição da meta do presente indicador, conforme data da aprovação do PN 2026 da CAIXA Loterias.

      2 Demanda tecnológica nº 24547165.

      3 Apostas do tipo teimosinha são aquelas realizadas pelo apostador para o concurso atual e para o número de concursos subsequentes a escolha deste.

