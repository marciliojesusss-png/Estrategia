    sha256: "ce84b4a7c43746bc821b4168dd335098ff232c17aa635cb4df6b5d32901a984e"
    observacaoLiteral: |-
      ▪ No contexto do objetivo do PEI “Nível 3 RGF-WLA – Executar ações de melhoria para os 10 elementos”, registra-se que, no 1TRI26, foi concluída a instituição do Fórum de Jogo Responsável, iniciativa que materializa o elemento “Engajamento das Partes Interessadas” ao reunir representantes para, em encontros semestrais, acompanhar o Programa, colher contribuições e preocupações e promover melhorias.

      ▪ No 2TRI26, até o momento, foi realizada ação sobre o elemento 8 - ORIENTAÇÃO SOBRE TRATAMENTO, tendo sido revista a relação de entidades indicadas para tratamento e atendimento ao público afetado.

      ▪ Há outras ações em execução, que avançam sobre os demais 8 elementos do Programa, e seu cronograma decorre de sequenciamento técnico, dependências entre entregas e cadência operacional de implementação, razão pela qual o atendimento ocorrerá em curva ao longo do exercício, conforme esperado para o período: 1 elemento no 1º trimestre; 2 elementos no 2º; 5 elementos no 3º; e 10 elementos no 4º trimestre, de forma cumulativa, mantendo a trajetória de evolução planejada do Programa. Finalizadas 2 das ações de 10 previstas para o ano. Desse modo, tem-se que o realizado no mês de abril cumpre o esperado para o período.

      ▪ Jogo Responsável, com disponibilização de autoavaliação e direcionamento para instituições de apoio e tratamento (Elemento 8 – Tratamento do Jogador); a realização de treinamento corporativo sobre Jogo Responsável para empregados e Alta Administração (Elemento 2 – Empregados); a capacitação na metodologia GamGard para equipes responsáveis pelo desenvolvimento e revisão de produtos e canais digitais (Elemento 4 – Design de Jogos e Elemento 5 – Jogos Remotos); e a evolução dos trabalhos de definição, aperfeiçoamento e consolidação de indicadores de monitoramento do Programa (Elemento 10 – Relatórios e Medição). Paralelamente, foram realizadas atividades de revisão, atualização e consolidação de evidências, acompanhamento do plano de ação corporativo e alinhamento com as áreas responsáveis pelos requisitos da certificação RGF/WLA. Dessa forma, o Programa avançou sobre os Elementos 2, 3, 4, 5, 8 e 10, mantendo trajetória compatível com o cronograma de evolução previsto para o exercício e superando o quantitativo mínimo esperado para o período.

      ▪ Há outras ações em execução, que avançam sobre os demais elementos do Programa, e seu cronograma decorre de sequenciamento técnico, dependências entre entregas e cadência operacional de implementação, razão pela qual o atendimento ocorrerá em curva ao longo do exercício, conforme esperado para o período: 1 elemento no 1º trimestre; 2 elementos no 2º; 5 elementos no 3º; e 10 elementos no 4º trimestre, de forma cumulativa, mantendo a trajetória de evolução planejada do Programa.

