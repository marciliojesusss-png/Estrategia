    observacaoLiteral: |-
      A seguinte curva de meta foi definida para 2026, considerando o comportamento de dados do realizado de arrecadação em 2025:
      ▪ 1TRI26: 100,50%;
      ▪ 2TRI26: 101,00%;
      ▪ 3TRI26: 101,50%;
      ▪ 4TRI26: 102,00%.

      Nos dados acumulados até JUN/26, a arrecadação da Rede Lotérica atingiu 98,8%, com alcance da meta 97,84%.

      Em análise dos dados, observa-se que, no recorte específico de JUN/26, o canal físico apresentou variação de 4,93%, em relação ao mesmo mês de 2025, em contexto influenciado pela dinâmica do comércio durante a Copa do Mundo 2026 e pela maior preferência dos clientes pelos canais digitais.

      Em função da dinâmica do comércio durante a Copa do Mundo 2026, observou-se impacto nos resultados de arrecadação do portfólio de loterias especialmente no canal físico, sendo observada a preferência do cliente para compras por meio dos canais digitais10, fator que contribui para a leitura do comportamento observado no trimestre.

