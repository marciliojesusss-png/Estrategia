    sha256: "d28eec220c4f52bc373cc64ba44fb94c605742216f51303719232ef3dbd7e19e"
    observacaoLiteral: |-
      ▪ A nota é calculada considerando a pesquisa NPS baseline de 55 pontos e a meta de 2026 para redução de 20% do gap em relação à nota de referência 70, resultado em 58 (((70-55 = 15)*20%=3) → 55+3=58

      ▪ A CAIXA Loterias alcançou 59,2 pontos de NPS no 2º trimestre de 2026, resultado 4,2 pontos superior à linha de base anterior (55,0 pontos) e equivalente a uma evolução de 7,64%.

      ▪ A pesquisa foi realizada no mês de junho/2026, com 48.003 respostas, refletindo a percepção dos clientes dos canais digitais da CAIXA Loterias. A distribuição dos respondentes foi composta por 34.863 promotores (72,63%), 6.694 neutros (13,94%) e 6.446 detratores (13,43%).

      *O ajuste formal será objeto de reavaliação no âmbito da revisão do Planejamento Estratégico 2026-2030 e do Plano de Negócios 2026.

