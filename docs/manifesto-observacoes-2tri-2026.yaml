    observacaoLiteral: |-
      ▪ Cenário com Lotex:

      A seguinte curva de meta foi definida para 2026, considerando o comportamento de dados do realizado de arrecadação em 2025:

      ▪ 1TRI26: arrecadação via ecossistema em 1º TR/2025 representou 0,90% do total. Acrescidos 10%, a meta para o período é de 0,99%;
      ▪ 2TRI26: arrecadação via ecossistema em 2TRI/2025 representou 0,78% do total. Acrescidos 10%, a meta para o período é de 0,86%;
      ▪ 3TRI26: arrecadação via ecossistema em 3TRI/2025 representou 0,74% do total. Acrescidos 10%, a meta para o período é de 0,81%;
      ▪ 4TRI26: arrecadação via ecossistema em 4TRI/2025 representou 0,65% do total. Acrescidos 10%, a meta para o período é de 0,72%.

      Ao longo do período do 2TRI26, o desempenho de vendas registrou realizado de 0,61%, representando R$ 74,1 milhões de arrecadação da Loteria Instantânea Exclusiva - Lotex, frente R$ 12,192 bilhões de arrecadação total, com atingimento de 71,12% da meta.

      Com foco na ampliação da oferta da Lotex e em alinhamento às iniciativas estratégicas, os seguintes projetos estão sendo conduzidos:

      • Programa de Afiliados Instantânea CAIXA Digital: ampliar a divulgação e a comercialização dos bilhetes da Lotex no formato digital, por meio das Unidades Lotéricas como afiliadas à plataforma oficial da CAIXA Loterias;

      • Instantânea CAIXA Compre Aqui: tem como finalidade ampliar os canais físicos de venda da Lotex, mediante a vinculação de Pontos de Venda a Unidades Lotéricas, que contribuirá para aumentar a comercialização do produto ao apostador.

      Cujos lançamentos estão previstos para o 3TRI/2026.

      Adicionalmente, menciona-se que a Lotex aguarda autorização da Secretaria de Prêmios e Apostas, vinculada ao Ministério da Fazenda, sobre a prorrogação da outorga para a CAIXA Loterias continuar comercializando o produto.

      Cabe destacar ainda que a meta projetada para o presente indicador considerou o lançamento de Apostas de Quota Fixa, cuja implementação permanece em avaliação, razão pela qual a premissa será reavaliada no âmbito da revisão do PEI 2026-2030

      Cenário com Lotex e ferramenta do Marketplace9:

      A seguinte curva de meta foi definida para 2026, considerando o comportamento de dados do realizado de arrecadação em 2025, somando Lotex e Marketplace:

      ▪ 1TRI26: arrecadação via ecossistema em 1º TR/2025 representou 3,42% do total. Acrescidos 10%, a meta para o período é de 3,76%;
      ▪ 2TRI26: arrecadação via ecossistema em 2TRI/2025 representou 3,27% do total. Acrescidos 10%, a meta para o período é de 3,60%;
      ▪ 3TRI26: arrecadação via ecossistema em 3TRI/2025 representou 3,32% do total. Acrescidos 10%, a meta para o período é de 3,65%;
      ▪ 4TRI26: arrecadação via ecossistema em 4TRI/2025 representou 3,46% do total. Acrescidos 10%, a meta para o período é de 3,80%.

      Ao fechamento do período 2TRI2026, o desempenho de vendas registrou realizado em 4,22%, com alcance da meta em 117,13%. As iniciativas do período reforçaram a atuação da Rede Lotérica via plataforma de comercialização de bolão online, Marketplace, além do resultado da Lotex, fatores que contribuíram para o resultado apurado na prestação de contas do mês.

      O referido indicador fará parte do escopo de revisão do Planejamento Estratégico 2026-2030 e do Plano de Negócios 2026.

      9 Marketplace - plataforma de comercialização de bolão online

