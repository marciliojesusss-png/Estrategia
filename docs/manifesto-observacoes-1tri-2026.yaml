  - indicadorId: 12
    nome: "Clima Organizacional (Pesquisa GPTW)"
    lancamentoId: 135
    competencia: "MAR/2026"
    paginasInforme: [16]
    notasExternasIncorporadas: []
    fonte: "Informe DILOT/GERIN nº 0029/2026"
    tamanhoCaracteres: 1210
    tamanhoUtf8Bytes: 1245
    sha256: "a28ff7d7ba2858612a62388bd9839fe2addd2179b48c6f9984a72416cc90396e"
    observacaoLiteral: |-
      Divulgação para os gestores, dos resultados da Pesquisa de Clima Organizacional referente ao exercício de 2025, promovendo o conhecimento e a transparência quanto à percepção dos empregados. A partir da análise dos resultados, foram identificados e priorizados os principais pontos de atenção e temas estratégicos a serem desenvolvidos ao longo do ano de 2026, alinhados às diretrizes institucionais de fortalecimento do clima organizacional. Ainda no mês de janeiro de 2026, foi definida a composição do grupo de empregados que atuarão diretamente na construção e detalhamento do plano de ação para o ciclo de 2026.

      Ademais, foi realizado o Workshop Plano de Ação CAIXA Loterias, conduzida pela GPTW, responsável pela Pesquisa de Clima Organizacional 2025 e pelo apoio metodológico ao ciclo de 2026. Durante o encontro, foram identificadas oportunidades de melhorias, definição dos planos de ação a serem desenvolvidos com desdobramento por equipes, garantindo representatividade, engajamento e estabelecimento de responsabilidades.

      As ações desenvolvidas ao longo dos meses têm como objetivo atingir a meta, cuja efetividade será avaliada após a realização de nova pesquisa a ser efetuada em novembro/2026.

