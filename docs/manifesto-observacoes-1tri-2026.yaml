    tamanhoUtf8Bytes: 1029
    sha256: "65326c74fd3124c938c0da741f8231764c404b803eda97157897a24445295190"
    observacaoLiteral: |-
      A base de dados referente à arrecadação nos canais eletrônicos, para apuração do indicador de vendas com PIX, não considera dados do Internet Banking CAIXA – IBC, tendo em vista que esse meio de pagamento não é aceito no IBC.

      A seguinte curva de meta foi definida para 2026:
      ▪ 1TRI26: 61%;
      ▪ 2TRI26: 62%;
      ▪ 3TRI26: 63%;
      ▪ 4TRI26: 65%.

      A meta estabelecida para o período considerou a projeção orçamentária prevista no Plano de Dispêndios Globais de 2026 da Companhia.

      Ao final do 1 TRI26, o realizado foi de R$ 1,127 bilhão de vendas com PIX, representando 67% das vendas nos canais eletrônicos, que registrou R$ 1.686,1 no total de arrecadação.
      No mesmo período de 2025, os dados de vendas com PIX foi de R$ 620,8 milhões, representando 56% das vendas nos canais eletrônicos, que registrou R$ 1.114,2 milhões no total de arrecadação.
      Considerando a meta de aumentar em 05 p.p. as vendas com o meio de pagamento Pix no canal eletrônico, o resultado representa 110,09% de atingimento da meta.

  - indicadorId: 10
    nome: "Share da Plataforma de Jogos"
    lancamentoId: 111
