    tamanhoUtf8Bytes: 1478
    sha256: "2670696ae41edc6074a4f363c70c3f0fce15dd8224ced8af82b27fd7e7f45b5b"
    observacaoLiteral: |-
      Inicialmente, cabe mencionar as metas previstas ao longo dos períodos do PEI 2026-2030 da CAIXA Loterias para este indicador:

      ▪ Ano 2026: Piloto ou MVP (Mínimo Produto Viável) da Plataforma de Jogos;
      ▪ Ano 2027: Implementação baseline de Participação de Mercado;
      ▪ Ano 2028: Estar entre as 05 maiores plataformas do ecossistema de jogos e apostas no Brasil;
      ▪ Ano 2029: Estar entre as 03 maiores plataformas do ecossistema de jogos e apostas no Brasil;
      ▪ Ano 2030: Ser a maior plataforma do ecossistema de jogos do Brasil.

      A meta do indicador para 2026 é o Piloto ou MVP (Mínimo Produto Viável) da Plataforma de Jogos, não havendo meta para o 1TRI26.

      Ao longo do 1 TRI26, foram realizadas ações para execução do projeto, como alocação de equipe do projeto, agenda de abertura (Kickoff), execução de dois ciclos de reuniões do projeto (sprints), contemplando o início dos trabalhos para definição da arquitetura do sistema, processos e ferramentas, criação do ambiente tecnológico, concessão de acessos, definição negocial da funcionalidade de cadastro de canais de venda de loterias.

      No que se refere à fórmula e descrição adotados para o presente indicador, registra-se a intenção de submeter Proposição específica ao Conselho de Administração propondo que a redação da descrição e fórmula sejam revisados. Além disso, até o momento, não foram identificados dados oficiais divulgados relacionados ao GGR de mercado.

