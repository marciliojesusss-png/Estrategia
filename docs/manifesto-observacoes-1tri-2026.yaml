    sha256: "defb84f453f2542397c4c40f73b3f1287fbc9b602e1cb911b4e2a59f57fda3c9"
    observacaoLiteral: |-
      Em março, a quantidade média mensal de clientes ativos foi de 2.982.989 (jan a mar/2026), representando um aumento de 74,41%, em comparação quantidade média mensal de clientes ativos no ano anterior, de 1.710.374 (jan a mar/2025), resultando em 265,73% como atingimento da meta do período.

      O resultado do indicador evidencia o sucesso das ações de aquisição, reativação e engajamento de clientes, além do impacto positivo das iniciativas de digitalização e personalização da jornada.

  - indicadorId: 4
    nome: "Aprimoramento da Experiência do Cliente"
    lancamentoId: 39
    competencia: "MAR/2026"
    paginasInforme: [10]
    notasExternasIncorporadas: [3]
    fonte: "Informe DILOT/GERIN nº 0029/2026"
    tamanhoCaracteres: 1339
    tamanhoUtf8Bytes: 1367
    sha256: "586a42301b2cb0d4b3be66a6fca239d43f9b244701389c8816749c157a904a4b"
    observacaoLiteral: |-
      A partir da realização da pesquisa NPS de baseline de 2025, foram definidas 22 melhorias como plano de trabalho ao longo do ano de 2026, em que para atingimento da meta anual do indicador para o ano é necessária a entrega de ao menos 06 melhorias, representando assim a meta de 25% das ocorrências apontadas.

      As melhorias mapeadas demandam implantação junto à área de TI da CAIXA.

      Nesse sentido, a curva definida para o ano foi estruturada trimestralmente da seguinte forma:
      ▪ 1TRI26: 4,54% - entrega de 01 melhoria do plano de trabalho de 2026;
      ▪ 2TRI26: 13,64% - entrega de 03 melhorias (acumuladas) do plano de trabalho de 2026;
      ▪ 3TRI26: 18,18% - entrega de 04 melhorias (acumuladas) do plano de trabalho de 2026;
      ▪ 4TRI26: 253% - entrega de 06 melhorias (acumuladas) do plano de trabalho de 2026.

      No 1º trimestre foi implementada 01 melhoria, representando 113,64% de atingimento da meta, que se refere envio de campanhas via push aos clientes, atendendo às reclamações de clientes indicando a necessidade de envio de mensagens educativas, atendendo aos princípios e diretrizes do Programa Jogo Responsável.

      3 O plano de trabalho previsto para atendimento desse indicador considera o escopo de 22 melhorias mapeadas posteriormente à definição da meta do presente indicador, conforme data da aprovação do PN 2026 da CAIXA Loterias.

