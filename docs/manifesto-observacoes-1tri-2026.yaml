    sha256: "efc678e31f01c2426e60df44cf2049c65686f708d4da0bb8d4cd87493abb0980"
    observacaoLiteral: |-
      O resultado evidencia a efetividade das ações de segmentação e personalização, bem como a evolução da capacidade analítica e operacional para ativação qualificada da base de clientes. Foram realizadas campanhas via push2, com foco na divulgação de concursos acumulados, modalidades de jogos, funcionalidades do App Loterias, jogos individuais e bolões, aniversários de clientes, feriados locais e promoção de jogo responsável. Foram alcançados 1.241.587 clientes, de uma base de 2.773.599 clientes, representando 44,76% do realizado e 447,64% do atingindo da meta.

      2 Uma campanha por meio de push (ou notificação push) é uma estratégia de marketing direto que consiste no envio de mensagens curtas e clicáveis diretamente para a tela do celular, tablet ou navegador de desktop do usuário.

  - indicadorId: 2
    nome: "Índice de Satisfação de Clientes — NPS"
    lancamentoId: 15
    competencia: "MAR/2026"
    paginasInforme: [8]
    notasExternasIncorporadas: []
    fonte: "Informe DILOT/GERIN nº 0029/2026"
    tamanhoCaracteres: 926
    tamanhoUtf8Bytes: 965
    sha256: "5e570f1024db6345b0fef569fee3a4bef79ed022d5bcc2a9b00c96dec0ddaafa"
    observacaoLiteral: |-
      Considerando a fórmula e meta estabelecida para o indicador, a meta anual é prevista é a nota de 58. A nota é calculada considerando a pesquisa NPS baseline de 55 pontos e a meta de 2026 para redução de 20% do gap em relação à nota de referência 70, resultado em 58.

      Nesse sentido, a mensuração do indicador está prevista para o final do ano de 2026, sendo que ao longo do exercício serão realizadas ações de melhorias junto aos clientes, acompanhadas pelo Indicador Aprimoramento da experiência do cliente – previsto no Plano de Negócios de 2026.

      * Considerando a baseline de 55 pontos e a diretriz de redução de 20% do gap em relação à nota de referência 70, a meta correta para 2026 corresponde a NPS igual a 58, registra-se a intenção de submeter Proposição específica ao Conselho de Administração o ajuste material do valor, de modo a preservar a coerência metodológica e a consistência da série histórica do indicador.

