    sha256: "804945d962fdb6426415a31f460ca3afc3a7e2682b1e509080693609ce3b72d9"
    observacaoLiteral: |-
      A seguinte curva de meta foi definida para 2026, considerando a Trilha de Desenvolvimento específica da CAIXA Loterias ainda em desenvolvimento:

      1TRI26: 90% do público-alvo com 01 curso “Curso de Jogo Responsável” concluído.
      2TR26: 90% do público-alvo com 02 cursos concluídos (acumulado) – Em elaboração
      3TRI26: 90% do público-alvo com 04 cursos concluídos (acumulado) – Em elaboração
      4TRI26: 90% do público-alvo com 05 cursos concluídos (acumulado) – Em elaboração

      Foi apurado que 137 funcionários, de 151 (90,7%), realizaram uma ação de disseminação de Jogo Responsável (JR) até MAR 2026, na Universidade CAIXA.

      Foi iniciado o desenvolvimento das Vitrines6 das Unidades da CAIXA Loterias a fim de direcionar a elaboração da Trilha de Capacitação específica para os empregados da Companhia, com previsão de implantação para o segundo trimestre.

      A partir do lançamento da Trilha, serão realizados trabalhos voltados para a disseminação da Trilha e engajamento dos colaboradores, com o monitoramento mensal até o cumprimento da meta estabelecida para o mês de DEZ/2026.

      6 Vitrine é um termo adotado na CAIXA Loterias em que cada Unidade da Companhia informa os conhecimentos, habilidades e perfis necessários às atividades daquela área.

