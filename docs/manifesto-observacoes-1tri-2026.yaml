    sha256: "e08651fac5ab90b1583c9239984446d1c40bb35f4b38bdc87eb513c8bace868e"
    observacaoLiteral: |-
      A partir da meta estabelecida de aumentar em 5 pontos percentuais para o ano de 2026, a meta do 1TRI26 foi de 28,05%, considerando o percentual de 23,05% de 2025 acrescido de 05 p.p.
      A arrecadação total no 1TRI/2025 foi de R$ 5.504,9 milhões e a arrecadação em canais eletrônicos foi de R$ 1.268,7 milhões, no mesmo período.
      Já no período 1TRI26, os dados realizados registraram a participação dos canais digitais em R$ 1.770,2 milhões, frente à arrecadação em canal físico de R$ 5.966,9 milhões, representando aumento de 29,67 p.p. em comparação ao ano anterior e 105,8% de atingimento da meta.
      O resultado reforça a maturidade das iniciativas digitais, a maior adesão dos clientes aos canais eletrônicos e a efetividade das estratégias de estímulo à migração digital.

