    sha256: "9218337b3d0f501bc0b82fec9ead79f2391ab0fcef9090da552f7d2e4553c99a"
    observacaoLiteral: |-
      Cenário com Lotex:

      A seguinte curva de meta foi definida para 2026, considerando o comportamento de dados do realizado de arrecadação em 2025:
      ▪ 1TRI26: arrecadação via ecossistema em 1º TR/2025 representou 0,90% do total. Acrescidos 10%, a meta para o período é de 0,99%;
      ▪ 2TRI26: arrecadação via ecossistema em 2TRI/2025 representou 0,78% do total. Acrescidos 10%, a meta para o período é de 0,86%;
      ▪ 3TRI26: arrecadação via ecossistema em 3TRI/2025 representou 0,74% do total. Acrescidos 10%, a meta para o período é de 0,81%;
      ▪ 4TRI26: arrecadação via ecossistema em 4TRI/2025 representou 0,65% do total. Acrescidos 10%, a meta para o período é de 0,72%.

      Ao longo do período do 1TRI26, o desempenho de vendas registrou realizado de 0,67%, representando R$ 39,8 milhões de arrecadação da Loteria Instantânea Exclusiva - Lotex, frente R$ 5.966,9 milhões de arrecadação total, com atingimento de 67,12% da meta.
      Para reversão do resultado do indicador, e em alinhamento às iniciativas estratégicas, os seguintes projetos estão sendo conduzidos com foco na ampliação de oferta da Lotex:

      • Programa de Afiliados Instantânea CAIXA Digital: ampliar a divulgação e a comercialização dos bilhetes da Lotex no formato digital, por meio das Unidades Lotéricas como afiliadas à plataforma oficial da CAIXA Loterias;
      • Instantânea CAIXA Compre Aqui: tem como finalidade ampliar os canais físicos de venda da Lotex, mediante a vinculação de Pontos de Venda a Unidades Lotéricas, que contribuirá para aumentar a comercialização do produto ao apostador.

      Adicionalmente, menciona-se que a Lotex aguarda autorização da Secretaria de Prêmios e Apostas, vinculada ao Ministério da Fazenda, sobre a prorrogação da outorga para a CAIXA Loterias continuar comercializando o produto.
      Cabe destacar ainda que a meta projetada para o presente indicador considerou o lançamento de Apostas de Quota Fixa, o que não foi realizado até o presente momento, sendo necessário revisão da meta no PEI 2026-2030.

      Cenário com Lotex e ferramenta Marketplace:

      A seguinte curva de meta foi definida para 2026, considerando o comportamento de dados do realizado de arrecadação em 2025, somando Lotex e Marketplace:
      ▪ 1TRI26: arrecadação via ecossistema em 1º TR/2025 representou 3,42% do total. Acrescidos 10%, a meta para o período é de 3,76%;
      ▪ 2TRI26: arrecadação via ecossistema em 2TRI/2025 representou 3,27% do total. Acrescidos 10%, a meta para o período é de 3,60%;
      ▪ 3TRI26: arrecadação via ecossistema em 3TRI/2025 representou 3,32% do total. Acrescidos 10%, a meta para o período é de 3,65%;
      ▪ 4TRI26: arrecadação via ecossistema em 4TRI/2025 representou 3,46% do total. Acrescidos 10%, a meta para o período é de 3,80%.

      O Marketplace de Bolões das Loterias CAIXA consiste em uma plataforma digital oficial que viabiliza a comercialização de cotas de bolões organizados pelas Unidades Lotéricas por meio dos canais eletrônicos das Loterias CAIXA, e a inclusão dos dados dessa ferramenta é aderente ao pilar estratégico Atuação em Ecossistema.

      Ao longo do período do 1 TRI26, o desempenho de vendas na ferramenta Marketplace e dados da Lotex registrou realizado de 4,06%, representando R$ 242,3 milhões de arrecadação, frente R$ 5.966,9 milhões de arrecadação total, com atingimento de 107,94% da meta.

      Como estratégia no âmbito da CAIXA Loterias, menciona-se as ações previstas ao longo do ano de 2026 para a alavancagem dos resultados oriundos da ferramenta Marketplace, além dos projetos já citados para ampliação de oferta da Lotex:

      • Programa de Aceleração do Marketplace Lotérico: foco na segmentação das Unidades Lotéricas de acordo com o perfil de atuação, com ações de mobilização e capacitação, para incentivo à venda de bolões no Marketplace.

      No que se refere à descrição do indicador e respectiva meta, registra-se que será submetida proposta ao Conselho de Administração a fim de ajustar a meta e descrição do presente indicador, de acordo com o orçamento da Companhia de 2026, que não considera dados de Apostas de Quota Fixa.

