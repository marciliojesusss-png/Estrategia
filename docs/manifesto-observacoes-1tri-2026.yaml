    observacaoLiteral: |-
      A meta estabelecida para o período considerou a projeção orçamentária prevista no orçamento da Companhia.

      Em janeiro/26 a Companhia obteve lucro líquido de R$ 119,4 milhões, receita total de R$ 223,6 milhões e nosso Indice de Eficiência Operacional atingiu 6,42%

      Em fevereiro/26 a Companhia obteve lucro líquido de R$ 222,0 milhões, receitas totais de R$ 438,9 milhões e despesas totais de R$ 216,9. Já no mês de março, o lucro líquido foi de R$ 336,3 milhões, receita total de R$ 663,2 milhões e despesas de R$ 326,3.

      No que se refere à meta anual estabelecida para o indicador, registra-se a intenção de submeter Proposição específica ao Conselho de Administração a atualização do indicador a fim de garantir a coerência metodológica e as projeções consideradas no PDG vigente.

