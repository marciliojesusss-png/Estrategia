      ▪ Entre 09 e 12/07/2026 foi realizado patrocínio ao Projeto Brasil Ladies Cup, com a Federação Internacional de Football Soccer Society (FIFOS), na cidade de Campinas/SP, com valor de investimento total de R$ 190.000,00 (cento e noventa mil reais), originados da reserva especial do Fundo para Desenvolvimento das Loterias (FDL), conforme aprovação pela alçada competente, conforme MN ZL026.

      ▪ Na edição 2026 da Brasil Ladies Cup, foram identificadas as seguintes entregas aderentes ao indicador:

      ▪ Acesso gratuito ao esporte: os ingressos de todos os jogos foram cedidos gratuitamente e disponibilizados por resgate em virtual, com público acumulado superior a 3 mil pessoas.

      ▪ Atendimento direto à comunidade: mais de 200 jovens da ONG Vaso do Oleiro, de Campinas/SP, visitaram o Estádio Brinco de Ouro, assistiram à final e participaram de conversa sobre futebol feminino. A organização informa ter custeado logística e alimentação.

      ▪ Formação e disseminação de conhecimento: foram realizados dois dias de palestras e workshops gratuitos, com mais de 60 inscrições presenciais e mais de 600 acompanhamentos on-line.

      ▪ Conteúdo formativo: as atividades abordaram futebol feminino, análise de desempenho e dados, formação e carreira de atletas, saúde e preparação física, universidade e ciência, scout, liderança e cultura e Copa do Mundo de 2027.

