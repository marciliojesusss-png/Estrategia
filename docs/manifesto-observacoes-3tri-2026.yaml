    sha256: "18e088154a2b5f73daa0c5e7127f0feb692f89cadd7a5d69d9ec4018fce1701d"
    observacaoLiteral: |-
      ▪ No 2TR/26 e 3TRI/26, foram concluídas as funcionalidades que permitem ao gestor criar e parametrizar produtos lotéricos em conformidade com a legislação aplicável, contemplando regras de rateio da arrecadação, cronograma de concursos, cadastro de produtos, tipos de apostas, concursos e tipos de concursos. Também evoluíram as funcionalidades relacionadas à distribuição da arrecadação (repasses, premiação e despesas de custeio e manutenção) e ao registro de apostas.

      ▪ Ao longo do trimestre, o projeto atingiu maior maturidade no detalhamento dos requisitos e na consolidação do escopo do MVP (Mínimo Produto Viável), estimado em aproximadamente 264 histórias de usuário. Esse refinamento permitiu aprimorar a mensuração da evolução da plataforma e estabelecer uma visão mais precisa do desenvolvimento efetivamente realizado.

      ▪ Considerando que as funcionalidades previstas para a plataforma possuem diferentes níveis de complexidade e esforço de implementação, a evolução do projeto não ocorre de forma linear entre os trimestres. Dessa forma, o acompanhamento do indicador passou a refletir a evolução acumulada do escopo efetivamente desenvolvido para o MVP, proporcionando uma avaliação mais aderente ao estágio atual do projeto.

      ▪ Nesse contexto, a evolução do desenvolvimento passou de aproximadamente 10% no início do trimestre para 37,9% ao final do 3TRI/26, representando avanço significativo na construção da plataforma. O resultado reflete tanto a conclusão de funcionalidades estruturantes quanto o aumento da capacidade de execução do projeto, com a incorporação, em agosto de 2026, de dois novos squads de desenvolvimento atuando em paralelo nas frentes de trabalho.

      ▪ Dessa forma, o acompanhamento do indicador passa a refletir a evolução acumulada do escopo efetivamente desenvolvido para o MVP, proporcionando uma visão mais aderente ao estágio atual do projeto e à complexidade da construção da nova plataforma.

      ▪ Embora o desafio de conclusão do MVP permaneça relevante, o projeto encontra-se estruturado, com escopo mapeado, metodologia de acompanhamento definida e capacidade de desenvolvimento ampliada para suportar a continuidade das entregas.

