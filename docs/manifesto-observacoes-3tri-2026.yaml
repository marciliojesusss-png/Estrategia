    observacaoLiteral: |-
      ▪ O resultado permanece positivo, demonstrando a evolução de ações no que se referem a qualificação da base de clientes.

      ▪ No período, foram realizadas campanhas via push voltadas à divulgação dos produtos de loterias, promoção do Jogo Responsável e comunicação de concursos especiais.

      ▪ A Lotofácil da Independência foi o principal destaque, concentrando 11 campanhas, número superior ao dos demais impulsionamentos realizados no período. A maior recorrência de comunicações contribuiu para que o concurso especial apresentasse também maior alcance entre as campanhas realizadas.

      ▪ As ações reforçam a utilização do canal push como instrumento de ativação e relacionamento com a base de clientes, especialmente em períodos estratégicos associados aos concursos especiais.

